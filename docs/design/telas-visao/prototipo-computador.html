<script>
const TEMPLATE = "<div style=\"position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); --bg: {{ th.bg }}; --sf: {{ th.sf }}; --ln: {{ th.ln }}; --ink: {{ th.ink }}; --mu: {{ th.mu }}; --chip: {{ th.chip }}; --code: {{ th.code }}; --codeink: {{ th.codeink }}\">\n<div style=\"height: 30px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--sf); border-bottom: 1px solid var(--ln)\">\n<span style=\"width: 12px; height: 12px; border-radius: 6px; background: #E5604F\"></span><span style=\"width: 12px; height: 12px; border-radius: 6px; background: #E0B23E\"></span><span style=\"width: 12px; height: 12px; border-radius: 6px; background: #58B55A\"></span>\n<span style=\"flex: 1 1 auto; text-align: center\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--mu);\">VISAO — app para Mac, Windows e Linux</span></span><span style=\"width: 52px\"></span></div><sc-if value=\"{{ s.login }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 80px; background: var(--bg)\">\n<div style=\"position: relative; width: 600px; height: 600px; background: #E39A2E; overflow: hidden; border-radius: 28px; flex-shrink: 0\">\n<svg width=\"600\" height=\"600\" viewBox=\"0 0 600 600\" aria-hidden=\"true\" style=\"position: absolute; inset: 0\"><text x=\"6\" y=\"528\" textLength=\"588\" lengthAdjust=\"spacingAndGlyphs\" style=\"font-family: 'Six Caps', sans-serif; font-size: 589px\" fill=\"#C98019\">VISAO</text></svg>\n<img src=\"assets/muninn-busto-largo.png\" alt=\"\" style=\"position: absolute; left: -142px; top: 59px; width: 857px; height: 857px; display: block\"></div>\n<form onSubmit=\"{{ enter }}\" style=\"width: 360px; display: flex; flex-direction: column; gap: 18px\">\n<h1 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 300; font-size: 48px; line-height: 1.05; color: var(--ink)\">Bem-vindo de volta.</h1>\n<p style=\"margin: 0; font-family: 'Geist', sans-serif; font-size: 15px; color: var(--mu)\">Só você entra aqui. Ele lembra apenas do que você deixar.</p>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'Geist', sans-serif; font-size: 13px; color: var(--ink)\">E-mail<input type=\"email\" value=\"allison@exemplo.com\" style=\"height: 46px; border-radius: 12px; border: 1px solid var(--ln); background: var(--sf); color: var(--ink); padding: 0 14px; font-family: 'Geist', sans-serif; font-size: 15px\"></label>\n<label style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'Geist', sans-serif; font-size: 13px; color: var(--ink)\">Senha<input type=\"password\" value=\"••••••••••\" style=\"height: 46px; border-radius: 12px; border: 1px solid var(--ln); background: var(--sf); color: var(--ink); padding: 0 14px; font-family: 'Geist', sans-serif; font-size: 15px\"></label>\n<button type=\"button\" onClick=\"{{ enter }}\" style=\"height: 48px; border-radius: 24px; border: none; background: var(--ink); color: var(--bg); font-family: 'Geist', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer\">Entrar</button>\n<button type=\"button\" onClick=\"{{ nav.boasvindas }}\" style=\"border: none; background: transparent; padding: 0; text-align: left; font-family: 'Geist', sans-serif; font-size: 14px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer\">Primeira vez? Configurar o VISAO</button><span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--mu);\">Protótipo: clique em Entrar.</span></form></div></sc-if><sc-if value=\"{{ s.boasvindas }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 80px; background: var(--bg)\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 18px\"><img src=\"assets/icone-grande-512.png\" alt=\"\" style=\"width: 260px; height: 260px; border-radius: 58px; display: block; flex-shrink: 0\"><div style=\"display: flex; gap: 8px\"><span style=\"width: 28px; height: 4px; border-radius: 2px; background: {{ obDot.0 }}\"></span><span style=\"width: 28px; height: 4px; border-radius: 2px; background: {{ obDot.1 }}\"></span><span style=\"width: 28px; height: 4px; border-radius: 2px; background: {{ obDot.2 }}\"></span><span style=\"width: 28px; height: 4px; border-radius: 2px; background: {{ obDot.3 }}\"></span></div></div>\n<div style=\"width: 460px; display: flex; flex-direction: column; gap: 24px\">\n<sc-if value=\"{{ ob.0 }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display: flex; flex-direction: column; gap: 16px\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--mu);\">PASSO 1 DE 4</span><h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 300; font-size: 40px; line-height: 1.1; color: var(--ink)\">Quem responde?</h2><p style=\"margin: 0; font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.6; color: var(--mu)\">Escolha o modelo principal. Dá para trocar depois, até no meio de uma conversa.</p><div style=\"border: 1px solid var(--ink); border-radius: 12px; padding: 12px 14px; background: var(--sf)\"><div style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink)\">Claude Sonnet · nuvem</div><div style=\"font-family: 'Geist', sans-serif; font-size: 12px; color: var(--mu)\">Melhor qualidade · paga por uso</div></div><div style=\"border: 1px solid var(--ln); border-radius: 12px; padding: 12px 14px; background: var(--sf)\"><div style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink)\">Qwen 3 4B · no seu Mac</div><div style=\"font-family: 'Geist', sans-serif; font-size: 12px; color: var(--mu)\">Grátis e privado · mais lento</div></div></div></sc-if>\n<sc-if value=\"{{ ob.1 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: flex; flex-direction: column; gap: 16px\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--mu);\">PASSO 2 DE 4</span><h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 300; font-size: 40px; line-height: 1.1; color: var(--ink)\">O que ele pode lembrar?</h2><p style=\"margin: 0; font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.6; color: var(--mu)\">Ele só guarda o que você deixar, e sempre mostra de onde veio cada lembrança.</p><div style=\"border: 1px solid var(--ink); border-radius: 12px; padding: 12px 14px; background: var(--sf)\"><div style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink)\">Perguntar antes de guardar</div><div style=\"font-family: 'Geist', sans-serif; font-size: 12px; color: var(--mu)\">Recomendado</div></div><div style=\"border: 1px solid var(--ln); border-radius: 12px; padding: 12px 14px; background: var(--sf)\"><div style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink)\">Não guardar nada</div><div style=\"font-family: 'Geist', sans-serif; font-size: 12px; color: var(--mu)\">Cada conversa começa do zero</div></div></div></sc-if>\n<sc-if value=\"{{ ob.2 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: flex; flex-direction: column; gap: 16px\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--mu);\">PASSO 3 DE 4</span><h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 300; font-size: 40px; line-height: 1.1; color: var(--ink)\">Conectar o seu Mac?</h2><p style=\"margin: 0; font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.6; color: var(--mu)\">Com o Braço, ele roda testes e mexe em arquivos, sempre pedindo aprovação antes.</p><pre style=\"margin: 0; padding: 14px; border-radius: 12px; background: #101214; color: #F3F1EC; font-family: 'Geist Mono', monospace; font-size: 13px\">curl -fsSL visao.dev/braco | sh</pre><span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--mu);\">Pode pular: dá para conectar depois em Ajustes.</span></div></sc-if>\n<sc-if value=\"{{ ob.3 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: flex; flex-direction: column; gap: 16px\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--mu);\">PASSO 4 DE 4</span><h2 style=\"margin: 0; font-family: 'Newsreader', serif; font-weight: 300; font-size: 40px; line-height: 1.1; color: var(--ink)\">Quando ele pode falar com você?</h2><p style=\"margin: 0; font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.6; color: var(--mu)\">Fora do silêncio, ele pode puxar conversa no máximo 3 vezes por dia.</p><div style=\"border: 1px solid var(--ink); border-radius: 12px; padding: 12px 14px; background: var(--sf)\"><div style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink)\">Silêncio das 22h às 7h</div><div style=\"font-family: 'Geist', sans-serif; font-size: 12px; color: var(--mu)\">Nada de notificações nesse horário</div></div><div style=\"border: 1px solid var(--ln); border-radius: 12px; padding: 12px 14px; background: var(--sf)\"><div style=\"font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink)\">Também no Telegram</div><div style=\"font-family: 'Geist', sans-serif; font-size: 12px; color: var(--mu)\">Conectar em Canais</div></div></div></sc-if>\n<div style=\"display: flex; gap: 8px\"><button type=\"button\" onClick=\"{{ obBack }}\" style=\"height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--ln); background: transparent; color: var(--ink); font-family: 'Geist', sans-serif; font-size: 14px; cursor: pointer;\">Voltar</button><button type=\"button\" onClick=\"{{ obNext }}\" style=\"height: 40px; padding: 0 18px; border-radius: 20px; border: none; background: var(--ink); color: var(--bg); font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;\">{{ obLabel }}</button></div></div></div></sc-if>\n<sc-if value=\"{{ s.ligacao }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #101214\">\n<span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: #9AA1A8;\"><span style=\"color: #E39A2E\">●</span> EM LIGAÇÃO · 00:42</span>\n<img src=\"assets/icone-grande-512.png\" alt=\"O corvo diante do sol: procurando no seu Gmail\" style=\"width: 380px; height: 380px; display: block\">\n<div style=\"font-family: 'Newsreader', serif; font-style: italic; font-weight: 300; font-size: 26px; color: #F3F1EC\">Procurando no seu Gmail…</div>\n<div style=\"max-width: 560px; text-align: center; font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.5; color: #9AA1A8\">Você: “vê se chegou a confirmação do hotel”</div>\n<div style=\"display: flex; gap: 12px; margin-top: 8px\"><button type=\"button\" aria-label=\"Silenciar\" style=\"width: 56px; height: 56px; border-radius: 28px; border: 1px solid #2C3136; background: transparent; color: #F3F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\" style=\"flex-shrink: 0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"7.5\" y=\"3\" width=\"5\" height=\"9\" rx=\"2.5\"/><path d=\"M5 10a5 5 0 0 0 10 0M10 15v2\"/></svg></button>\n<button type=\"button\" onClick=\"{{ nav.chat }}\" style=\"height: 56px; padding: 0 34px; border-radius: 28px; border: none; background: #F3F1EC; color: #101214; font-family: 'Geist', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer\">Desligar</button></div>\n<span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: #5B6066;\">Nos nanorrobôs, o corvo vira a ferramenta (aqui, o envelope) e volta quando termina.</span></div></sc-if>\n<sc-if value=\"{{ inApp }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0\"><div style=\"flex: 1 1 auto; display: flex; min-height: 0\"><aside style=\"width: 248px; flex-shrink: 0; box-sizing: border-box; border-right: 1px solid var(--ln); background: var(--sf); display: flex; flex-direction: column; padding: 16px 12px 12px; gap: 14px\">\n<div style=\"display: flex; align-items: center; gap: 10px; padding: 0 6px\"><img src=\"assets/icone-pequeno-256.png\" alt=\"\" style=\"width: 30px; height: 30px; border-radius: 8px; display: block; flex-shrink: 0\"><span style=\"font-family: 'Six Caps', sans-serif; font-size: 34px; line-height: 1; letter-spacing: 0.04em; color: var(--ink)\">VISAO</span></div>\n<div style=\"display: flex; gap: 6px\">\n<button type=\"button\" onClick=\"{{ nav.chat }}\" style=\"flex: 1 1 auto; height: 36px; border-radius: 9px; border: 1px solid var(--ln); background: var(--bg); color: var(--ink); font-family: 'Geist', sans-serif; font-size: 13px; display: flex; align-items: center; gap: 8px; padding: 0 10px; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" aria-hidden=\"true\" style=\"flex-shrink: 0\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 4v12M4 10h12\"/></svg> Nova conversa</button>\n<button type=\"button\" aria-label=\"Buscar e comandos (Ctrl K)\" onClick=\"{{ openPalette }}\" style=\"width: 44px; height: 36px; border-radius: 9px; border: 1px solid var(--ln); background: var(--bg); color: var(--mu); display: flex; align-items: center; justify-content: cen

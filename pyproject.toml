[project]
name = "visao"
version = "0.0.1"
description = "Projeto VISÃO: pesquisa experimental em arquitetura cognitiva persistente"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "pywebpush>=2.0",
    "anthropic>=2.8",
    # The Google connection is kept encrypted (core/google/account.py).
    "cryptography>=44",
    # arXiv feeds are parsed without entity expansion or external references.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Self-hosted speech synthesis (docs/VOICE.md). Heavy; not needed by the API core or the tests.
tts = [
    "kokoro-onnx==0.6.1",
    "piper-tts==1.8.0",
]
# Self-hosted speech recognition (docs/VOICE.md).
stt = [
    "faster-whisper==1.2.1",
    # faster-whisper 1.2.1 passes av.open(metadata_errors=...), removed in PyAV 19.
    "av==16.1.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "integrations*", "infrastructure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requer PostgreSQL real (VISION_TEST_DATABASE_URL)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

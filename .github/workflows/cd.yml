name: CD Cloudflare
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: visao-production
  cancel-in-progress: false
jobs:
  rejected:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record rejected code experiment
        env:
          VISION_CODE_AUTONOMY_KEY: ${{ secrets.VISION_CODE_AUTONOMY_KEY }}
        run: python infrastructure/evolution/runner.py report-head --status rejected
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://visao.auris-api.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            infrastructure/cloudflare/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: npm --prefix infrastructure/cloudflare ci
      - name: Deploy tested revision and verify live server
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7cd4c728c353847a922e39d59fe363d
          VISION_CODE_AUTONOMY_KEY: ${{ secrets.VISION_CODE_AUTONOMY_KEY }}
        run: python infrastructure/deployment/release.py

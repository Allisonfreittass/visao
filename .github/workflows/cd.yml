# Publica no servidor (Lightsail) a revisão da main que passou no CI: imagem Docker e web vão
# por SSH, deploy/activate.sh troca a release e infrastructure/deployment/release.py confere a
# revisão no ar, voltando para a anterior se ela não responder. Ver docs/LIGHTSAIL.md.
#
# Só roda com a variável VISAO_PUBLIC_URL definida no repositório. Segredos no Environment
# "production": VPS_HOST, VPS_SSH_KEY (chave do usuário deploy), VPS_KNOWN_HOSTS e, se a
# evolução de código estiver ligada, VISION_CODE_AUTONOMY_KEY.
name: CD
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visao-production
  cancel-in-progress: false
jobs:
  rejected:
    if: >-
      vars.VISAO_PUBLIC_URL != '' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Record rejected code experiment
        env:
          VISAO_PUBLIC_URL: ${{ vars.VISAO_PUBLIC_URL }}
          VISION_CODE_AUTONOMY_KEY: ${{ secrets.VISION_CODE_AUTONOMY_KEY }}
        run: python infrastructure/evolution/runner.py report-head --status rejected

  deploy:
    if: >-
      vars.VISAO_PUBLIC_URL != '' &&
      (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.VISAO_PUBLIC_URL }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Web build
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build
          mkdir -p release
          tar -czf "release/web-$SHA.tar.gz" -C apps/web/dist .
      - name: Imagem Docker
        run: |
          docker build -t "visao:$SHA" .
          docker save "visao:$SHA" | gzip > "release/visao-$SHA.tar.gz"
      - name: Acesso ao servidor
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publicar e conferir a revisão no ar
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VISAO_DEPLOY_TARGET: lightsail
          VISAO_PUBLIC_URL: ${{ vars.VISAO_PUBLIC_URL }}
          VISION_CODE_AUTONOMY_KEY: ${{ secrets.VISION_CODE_AUTONOMY_KEY }}
        run: python infrastructure/deployment/release.py

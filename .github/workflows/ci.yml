name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Every other run gets a group of
# its own, so nothing on main is ever cancelled or dropped from the queue: CD deploys from its
# result, and treats a cancelled run as a rejected one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vision_test
          POSTGRES_USER: vision
          POSTGRES_PASSWORD: vision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vision -d vision_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VISION_TEST_DATABASE_URL: postgresql+psycopg://vision:vision@localhost:5432/vision_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Smoke test docker compose
        env:
          VISION_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-000
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/ready
          docker compose down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

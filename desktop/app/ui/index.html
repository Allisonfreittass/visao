<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V.I.S.A.O.</title>
    <style>
      /* Shown while the server starts (a few seconds; longer on the first start, when the database
         is made). Tinta and papel, the brand's two grounds (DESIGN.md); nothing to load. */
      :root { color-scheme: light dark; --bg: #f6f4ef; --text: #101214; --muted: #5d6166; --luz: #e39a2e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101214; --text: #f6f4ef; --muted: #9da2a7; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--text);
        font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
      main { display: grid; justify-items: center; gap: 18px; max-width: 420px; padding: 24px; text-align: center; }
      .luz { width: 12px; height: 12px; border-radius: 50%; background: var(--luz); animation: pulsa 1.6s ease-in-out infinite; }
      h1 { margin: 0; font: 400 22px/1.3 -apple-system, BlinkMacSystemFont, sans-serif; }
      p { margin: 0; color: var(--muted); }
      [data-erro] .luz { animation: none; background: var(--muted); }
      @keyframes pulsa { 50% { opacity: .35; transform: scale(.8); } }
      @media (prefers-reduced-motion: reduce) { .luz { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <span class="luz" aria-hidden="true"></span>
      <h1 id="titulo">Abrindo o V.I.S.A.O.…</h1>
      <p id="estado" role="status">Na primeira vez ele prepara o banco de dados; leva alguns segundos.</p>
    </main>
  </body>
</html>

# Local stack: PostgreSQL (pgvector), API and worker.
#
# Configuration comes from .env (copy .env.example): every VISION_* variable there reaches the
# api and the worker, so a new Settings field needs no change here. .env is optional (CI has
# none and passes VISION_SECRET_KEY and POSTGRES_PASSWORD from its environment); `env_file`
# with `required: false` needs Docker Compose >= 2.24.
#
# The keys under `environment:` win over .env: the containers always use the db service below,
# even when .env points VISION_DATABASE_URL at a shared database for `npm start`.

x-vision-app: &vision-app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    VISION_ENVIRONMENT: ${VISION_ENVIRONMENT:-development}
    VISION_SECRET_KEY: ${VISION_SECRET_KEY:?defina VISION_SECRET_KEY no .env}
    VISION_DATABASE_URL: postgresql+psycopg://vision:${POSTGRES_PASSWORD}@db:5432/vision
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vision
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Local only. PostgreSQL must never be exposed publicly.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d vision"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *vision-app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *vision-app
    command: ["python", "-m", "apps.worker.main"]
    # The image's HEALTHCHECK probes the API port; the worker reports health by heartbeat instead.
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
